<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldSignal XAUUSD</title>

<style>
body{margin:0;background:#0d1117;color:white;font-family:Arial;text-align:center}
.box{max-width:500px;margin:auto;padding:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:20px;margin-top:20px}
#signal{font-size:45px;font-weight:bold;padding:25px;border-radius:15px;background:#555}
.buy{background:#16834b!important}
.sell{background:#c62828!important}
.wait{background:#555!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.item{background:#0d1117;padding:15px;border-radius:10px}
.val{font-size:20px;font-weight:bold;margin-top:5px}
#status{margin:15px 0;color:#9da7b3}
</style>
</head>

<body>

<div class="box">

<h1>GOLD / XAUUSD</h1>
<div>LIVE BUY / SELL SIGNAL</div>

<div class="card">

<div id="signal" class="wait">CONNECTING...</div>

<div id="status">Connecting to Deriv...</div>

<div class="grid">

<div class="item">
PRICE
<div id="price" class="val">--</div>
</div>

<div class="item">
RSI
<div id="rsi" class="val">--</div>
</div>

<div class="item">
EMA 9
<div id="ema9" class="val">--</div>
</div>

<div class="item">
EMA 21
<div id="ema21" class="val">--</div>
</div>

</div>

</div>

</div>

<script>

let ws;
let candles=[];
let symbol=null;

function setStatus(x){
document.getElementById("status").innerText=x;
}

function EMA(v,p){

if(v.length<p)return null;

let k=2/(p+1);
let e=v.slice(0,p).reduce((a,b)=>a+b,0)/p;

for(let i=p;i<v.length;i++)
e=v[i]*k+e*(1-k);

return e;
}

function RSI(v,p=14){

if(v.length<=p)return null;

let gain=0,loss=0;

for(let i=v.length-p;i<v.length;i++){

let d=v[i]-v[i-1];

if(d>0)gain+=d;
else loss-=d;

}

if(loss===0)return 100;

let rs=(gain/p)/(loss/p);

return 100-(100/(1+rs));
}


function connect(){

setStatus("Connecting to Deriv...");

ws=new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);

ws.onopen=()=>{

setStatus("Connected. Loading GOLD...");

ws.send(JSON.stringify({

active_symbols:"brief",

product_type:"basic",

req_id:1

}));

};


ws.onmessage=(event)=>{

let d;

try{
d=JSON.parse(event.data);
}catch(e){
return;
}


/* SHOW REAL ERROR */

if(d.error){

setStatus(
"DERIV ERROR: "+
(d.error.message||"Unknown error")
);

return;

}


/* FIND GOLD */

if(d.msg_type==="active_symbols"){

let list=d.active_symbols||[];

let gold=list.find(x=>{

let s=(
x.symbol||
x.underlying_symbol||
""
).toUpperCase();

let n=(
x.display_name||
x.underlying_symbol_name||
""
).toUpperCase();

return s.includes("XAU") ||
n.includes("XAU") ||
n.includes("GOLD");

});


if(!gold){

setStatus("XAUUSD/GOLD not found.");

return;

}

symbol=
gold.symbol||
gold.underlying_symbol;

setStatus(
"GOLD FOUND: "+symbol+
" • Loading candles..."
);


/* 1-MINUTE CANDLES */

ws.send(JSON.stringify({

ticks_history:symbol,

style:"candles",

granularity:60,

count:200,

end:"latest",

subscribe:1,

req_id:2

}));

}


/* CANDLES */

if(d.msg_type==="candles"){

candles=(d.candles||[]).map(c=>({

time:Number(c.epoch),

open:Number(c.open),

high:Number(c.high),

low:Number(c.low),

close:Number(c.close)

}));

update();

}


/* LIVE CANDLE */

if(d.msg_type==="ohlc"){

let c={

time:Number(d.ohlc.epoch),

open:Number(d.ohlc.open),

high:Number(d.ohlc.high),

low:Number(d.ohlc.low),

close:Number(d.ohlc.close)

};

let i=candles.findIndex(
x=>x.time===c.time
);

if(i>=0)
candles[i]=c;
else
candles.push(c);

candles=candles.slice(-200);

update();

}

};


ws.onerror=()=>{

setStatus(
"WebSocket error — check internet/Deriv connection"
);

};


ws.onclose=()=>{

setStatus(
"Connection closed — reconnecting..."
);

setTimeout(connect,3000);

};

}


function update(){

if(candles.length<30)return;


/* Ignore unfinished candle */

let c=candles.slice(0,-1);

let closes=c.map(x=>x.close);

let last=c[c.length-1];

let e9=EMA(closes,9);
let e21=EMA(closes,21);
let r=RSI(closes,14);

document.getElementById("price")
.innerText=last.close.toFixed(2);

document.getElementById("ema9")
.innerText=e9.toFixed(2);

document.getElementById("ema21")
.innerText=e21.toFixed(2);

document.getElementById("rsi")
.innerText=r.toFixed(1);


/* Recent levels */

let recent=c.slice(-20,-1);

let resistance=Math.max(
...recent.map(x=>x.high)
);

let support=Math.min(
...recent.map(x=>x.low)
);

let bullish=last.close>last.open;
let bearish=last.close<last.open;

let signal="WAIT";
let reason="No complete confirmation";


/* BUY */

if(
e9>e21 &&
r>=52 &&
r<=72 &&
bullish &&
last.close>resistance
){

signal="BUY";
reason="Bullish breakout confirmed";

}


/* SELL */

else if(
e9<e21 &&
r>=28 &&
r<=48 &&
bearish &&
last.close<support
){

signal="SELL";
reason="Bearish breakdown confirmed";

}


let box=document.getElementById("signal");

box.innerText=signal;
box.className=signal.toLowerCase();

setStatus(
reason+
" • "+
new Date(last.time*1000)
.toLocaleTimeString()
);

}

connect();

</script>

</body>
</html>
