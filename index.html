<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Connection Test</title>
<style>
body{
background:#0d1117;color:white;font-family:Arial;
text-align:center;padding:30px
}
#status{
font-size:28px;margin-top:40px;
padding:25px;border-radius:15px;background:#555
}
</style>
</head>

<body>

<h1>DERIV CONNECTION TEST</h1>

<div id="status">CONNECTING...</div>

<script>

const status=document.getElementById("status");

function show(text){
status.innerText=text;
}

try{

const ws=new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);

ws.onopen=function(){

show("CONNECTED ✅");

ws.send(JSON.stringify({
active_symbols:"brief",
product_type:"basic",
req_id:1
}));

};

ws.onmessage=function(event){

const d=JSON.parse(event.data);

if(d.error){

show("DERIV ERROR: "+d.error.message);

return;
}

if(d.msg_type==="active_symbols"){

show("DERIV CONNECTED ✅");

}

};

ws.onerror=function(){

show("WEBSOCKET ERROR ❌");

};

ws.onclose=function(){

show("CONNECTION CLOSED ❌");

};

}catch(e){

show("ERROR: "+e.message);

}

</script>

</body>
</html>
