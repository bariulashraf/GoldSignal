<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldSignal XAUUSD</title>
<style>
body{margin:0;background:#0d1117;color:white;font-family:Arial;text-align:center}
.container{max-width:500px;margin:auto;padding:20px}
h1{margin-bottom:5px}
.sub{color:#9da7b3}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:20px;margin-top:20px}
#signal{font-size:45px;font-weight:bold;padding:25px;border-radius:15px;background:#30363d}
.buy{background:#16834b!important}
.sell{background:#c62828!important}
.wait{background:#555!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.box{background:#0d1117;padding:12px;border-radius:10px}
.value{font-size:20px;font-weight:bold;margin-top:5px}
small{display:block;color:#8b949e;margin-top:20px;line-height:1.5}
</style>
</head>

<body>

<div class="container">

<h1>GOLD / XAUUSD</h1>
<div class="sub">Live BUY / SELL Indicator</div>

<div class="card">

<div id="signal" class="wait">CONNECTING...</div>

<div id="status" class="sub" style="margin-top:10px">
Connecting to market...
</div>

<div class="grid">

<div class="box">
Price
<div id="price" class="value">--</div>
</div>

<div class="box">
RSI
<div id="rsi" class="value">--</div>
</div>

<div class="box">
EMA 9
<div id="ema9" class="value">--</div>
</div>

<div class="box">
EMA 21
<div id="ema21" class="value">--</div>
</div>

</div>

<small>
BUY = bullish confirmation<br>
SELL = bearish confirmation<br>
WAIT = no complete confirmation<br><br>
This is a trading indicator, not a guarantee of profit.
</small>

</div>
</div>

<script>

let ws;
let symbol;
let candles=[];

function EMA(values,period){

if(values.length<period)return null;

let k=2/(period+1);

let e=values.slice(0,period)
.reduce((a,b)=>a+b,0)/period;

for(let i=period;i<values.length;i++){
e=values[i]*k+e*(1-k);
}

return e;
}

function RSI(values,period=14){

if(values.length<=period)return null;

let gain=0;
let loss=0;

for(let i=values.length-period;i<values.length;i++){

let d=values[i]-values[i-1];

if(d>0)gain+=d;
else loss-=d;

}

if(loss===0)return 100;

let rs=(gain/period)/(loss/period);

return 100-(100/(1+rs));
}

function connect(){

ws=new WebSocket(
"wss://ws.derivws.com/websockets/v3?app_id=1089"
);

ws.onopen=function(){

ws.send(JSON.stringify({
active_symbols:"brief",
product_type:"basic"
}));

};

ws.onmessage=function(event){

let data=JSON.parse(event.data);

if(data.error){

document.getElementById("status").innerText=
data.error.message;

return;
}

if(data.active_symbols){

let gold=data.active_symbols.find(x=>
/xau.*usd|gold.*usd/i.test(
(x.symbol||"")+" "+(x.display_name||"")
)
);

if(!gold){

document.getElementById("status").innerText=
"Gold symbol not found.";

return;
}

symbol=gold.symbol;

ws.send(JSON.stringify({

ticks_history:symbol,
style:"candles",
granularity:60,
count:200,
end:"latest",
subscribe:1

}));

document.getElementById("status").innerText=
"LIVE • "+(gold.display_name||symbol);

}

if(data.candles){

candles=data.candles.map(x=>({

time:Number(x.epoch),
open:Number(x.open),
high:Number(x.high),
low:Number(x.low),
close:Number(x.close)

}));

update();

}

if(data.ohlc){

let x={

time:Number(data.ohlc.epoch),
open:Number(data.ohlc.open),
high:Number(data.ohlc.high),
low:Number(data.ohlc.low),
close:Number(data.ohlc.close)

};

let index=candles.findIndex(
c=>c.time===x.time
);

if(index>=0)
candles[index]=x;
else
candles.push(x);

candles=candles.slice(-200);

update();

}

};

ws.onclose=function(){

document.getElementById("status").innerText=
"Disconnected — reconnecting...";

setTimeout(connect,3000);

};

}

function update(){

if(candles.length<30)return;

/* Use only CLOSED candles */

let closed=candles.slice(0,-1);

let closes=closed.map(x=>x.close);

let last=closed[closed.length-1];

let ema9=EMA(closes,9);
let ema21=EMA(closes,21);
let rsi=RSI(closes,14);

/* Recent support/resistance */

let recent=closed.slice(-20,-1);

let resistance=Math.max(
...recent.map(x=>x.high)
);

let support=Math.min(
...recent.map(x=>x.low)
);

document.getElementById("price").innerText=
last.close.toFixed(2);

document.getElementById("ema9").innerText=
ema9 ? ema9.toFixed(2) : "--";

document.getElementById("ema21").innerText=
ema21 ? ema21.toFixed(2) : "--";

document.getElementById("rsi").innerText=
rsi ? rsi.toFixed(1) : "--";

let signal="WAIT";
let reason="Waiting for confirmation";

let bullish=last.close>last.open;
let bearish=last.close<last.open;

if(ema9 && ema21 && rsi!==null){

/* BUY */

if(
ema9>ema21 &&
rsi>=52 &&
rsi<=72 &&
bullish &&
last.close>resistance
){

signal="BUY";
reason="Bullish trend + RSI + breakout";

}

/* SELL */

else if(
ema9<ema21 &&
rsi>=28 &&
rsi<=48 &&
bearish &&
last.close<support
){

signal="SELL";
reason="Bearish trend + RSI + breakdown";

}

else{

reason="No complete confirmation";

}

}

let box=document.getElementById("signal");

box.innerText=signal;
box.className=signal.toLowerCase();

document.getElementById("status").innerText=
reason+" • "+new Date(
last.time*1000
).toLocaleTimeString();

}

connect();

</script>

</body>
</html>
